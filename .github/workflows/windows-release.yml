name: Windows two-key build and release
on:
  push:
    branches: [release/two-activation-keys-20261006]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: touchcursor-windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Cache source-built dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: C:\tc-deps
          key: tc-msvc143-x86-wx326-boost186-v1
      - name: Build dependencies from source
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item C:\tc-deps -ItemType Directory -Force | Out-Null
          Invoke-WebRequest https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.6/wxWidgets-3.2.6.zip -OutFile C:\tc-deps\wx.zip
          Expand-Archive C:\tc-deps\wx.zip C:\tc-deps\wx-extracted
          $wxRoot = Get-ChildItem C:\tc-deps\wx-extracted -Filter configure -Recurse | Select-Object -First 1
          if (!$wxRoot) { throw 'wxWidgets source archive layout was not recognized' }
          Move-Item $wxRoot.Directory.FullName C:\tc-deps\wx
          Invoke-WebRequest https://archives.boost.io/release/1.86.0/source/boost_1_86_0.zip -OutFile C:\tc-deps\boost.zip
          Expand-Archive C:\tc-deps\boost.zip C:\tc-deps
          Push-Location C:\tc-deps\boost_1_86_0
          cmd /c bootstrap.bat
          if ($LASTEXITCODE) { throw 'Boost bootstrap failed' }
          .\b2.exe -j4 toolset=msvc-14.3 address-model=32 variant=debug,release link=static runtime-link=shared --with-serialization stage
          if ($LASTEXITCODE) { throw 'Boost build failed' }
          New-Item lib32-msvc-14.3 -ItemType Directory -Force | Out-Null
          Copy-Item stage\lib\*.lib lib32-msvc-14.3
          Pop-Location
          Push-Location C:\tc-deps\wx\build\msw
          nmake /nologo /f makefile.vc BUILD=release SHARED=0 UNICODE=1 RUNTIME_LIBS=dynamic
          if ($LASTEXITCODE) { throw 'wxWidgets build failed' }
          Pop-Location
          Push-Location C:\tc-deps\wx\utils\wxrc
          nmake /nologo /f makefile.vc BUILD=release SHARED=0 UNICODE=1 RUNTIME_LIBS=dynamic
          if ($LASTEXITCODE) { throw 'wxrc build failed' }
          Pop-Location
          Remove-Item C:\tc-deps\wx.zip,C:\tc-deps\boost.zip
      - name: Build release and execute regression tests
        shell: pwsh
        run: ./tools/build-windows.ps1
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchcursor-windows-build-evidence
          path: |
            dist/*
            tests/*.log
            tests/*.png
          if-no-files-found: ignore
      - name: Publish tested fork release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.7.1-two-keys-20261006'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists. Review it instead of overwriting it.' }
          gh release create $tag dist/*.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'TouchCursor: two activation keys, Windows x86' --notes-file RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE) { throw 'Release publication failed' }
