name: TouchCursor PR24 Windows validation

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Fetch Boost 1.86
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\dev\external | Out-Null
          Invoke-WebRequest -Uri "https://archives.boost.io/release/1.86.0/source/boost_1_86_0.zip" -OutFile "$env:RUNNER_TEMP\boost.zip"
          Expand-Archive "$env:RUNNER_TEMP\boost.zip" -DestinationPath C:\dev\external -Force

      - name: Build Boost serialization x86
        shell: cmd
        working-directory: C:\dev\external\boost_1_86_0
        run: |
          call bootstrap.bat
          b2.exe toolset=msvc-14.3 address-model=32 architecture=x86 variant=debug,release link=static runtime-link=shared threading=multi --with-serialization stage --stagedir=stage32
          if errorlevel 1 exit /b %errorlevel%
          if not exist lib32-msvc-14.3 mkdir lib32-msvc-14.3
          copy /Y stage32\lib\*.lib lib32-msvc-14.3\
          if errorlevel 1 exit /b %errorlevel%

      - name: Fetch wxWidgets
        shell: pwsh
        run: |
          $versions = @("3.2.11","3.2.10","3.2.8")
          $downloaded = $false
          foreach ($v in $versions) {
            try {
              $url = "https://github.com/wxWidgets/wxWidgets/releases/download/v$v/wxWidgets-$v.zip"
              Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\wx.zip"
              $downloaded = $true
              break
            } catch {
              Write-Host "wxWidgets $v unavailable, trying next"
            }
          }
          if (-not $downloaded) { throw "Could not download a wxWidgets 3.2 release" }
          New-Item -ItemType Directory -Force C:\dev\external\wxWidgets-3.2.11 | Out-Null
          Expand-Archive "$env:RUNNER_TEMP\wx.zip" -DestinationPath C:\dev\external\wxWidgets-3.2.11 -Force

      - name: Build wxWidgets static x86 debug and release
        shell: cmd
        working-directory: C:\dev\external\wxWidgets-3.2.11\build\msw
        run: |
          nmake /nologo -f makefile.vc BUILD=debug SHARED=0 TARGET_CPU=X86 RUNTIME_LIBS=dynamic
          if errorlevel 1 exit /b %errorlevel%
          nmake /nologo -f makefile.vc BUILD=release SHARED=0 TARGET_CPU=X86 RUNTIME_LIBS=dynamic
          if errorlevel 1 exit /b %errorlevel%

      - name: Build Debug Win32 with regression tests
        shell: cmd
        run: |
          msbuild touchcursor.sln /p:Configuration=Debug /p:Platform=Win32 /t:Rebuild /m /nologo
          if errorlevel 1 exit /b %errorlevel%

      - name: Load Debug DLL and execute UNIT_TEST initializer
        shell: pwsh
        run: |
          @'
          #include <windows.h>
          int wmain() {
              HMODULE module = LoadLibraryW(L"bin\\Debug\\touchcursor.dll");
              if (!module) return static_cast<int>(GetLastError());
              FreeLibrary(module);
              return 0;
          }
          '@ | Set-Content -Encoding ascii loadtest.cpp
          cl /nologo /EHsc /MDd /DUNICODE /D_UNICODE /Fe:loadtest.exe loadtest.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\loadtest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release Win32
        shell: cmd
        run: |
          msbuild touchcursor.sln /p:Configuration=Release /p:Platform=Win32 /t:Rebuild /m /nologo
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify release outputs
        shell: pwsh
        run: |
          $required = @(
            "bin\Release\touchcursor.exe",
            "bin\Release\touchcursor.dll",
            "bin\Release\tcconfig.exe",
            "bin\Release\touchcursor_update.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing release output: $path" }
          }

      - name: Package tested fork build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\TouchCursor-PR24 | Out-Null
          Copy-Item bin\Release\touchcursor.exe dist\TouchCursor-PR24\
          Copy-Item bin\Release\touchcursor.dll dist\TouchCursor-PR24\
          Copy-Item bin\Release\tcconfig.exe dist\TouchCursor-PR24\
          Copy-Item bin\Release\touchcursor_update.exe dist\TouchCursor-PR24\
          Copy-Item COPYING.txt dist\TouchCursor-PR24\
          Compress-Archive -Path dist\TouchCursor-PR24 -DestinationPath dist\TouchCursor-PR24-Windows-x86.zip -Force

      - name: Upload tested Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TouchCursor-PR24-Windows-x86
          path: dist/TouchCursor-PR24-Windows-x86.zip
          if-no-files-found: error
